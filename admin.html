<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    英姐蔬果商行｜後台管理
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=40"
  >
<link rel="stylesheet" href="theme.css?v=40"></head>


<body class="shop-admin">

  <!-- =========================
       後台頂部
  ========================== -->

  <header class="top-header">

    <div class="top-header-inner">

      <div>

        <div class="store-name">
          ⚙️ 英姐蔬果商行｜後台
        </div>

        <div class="store-subtitle">
          網站管理系統
        </div>

      </div>


      <a
        class="admin-link"
        href="index.html"
      >
        回前台
      </a>

    </div>

  </header>


  <main class="app-main">


    <!-- =========================
         管理員登入
    ========================== -->

    <section
      id="login"
      class="panel"
    >

      <h2>
        🔐 管理員登入
      </h2>


      <label class="form-label">

        <span>
          Email
        </span>

        <input
          id="email"
          type="email"
          placeholder="管理員 Email"
          autocomplete="username"
        >

      </label>


      <label class="form-label">

        <span>
          密碼
        </span>

        <input
          id="password"
          type="password"
          placeholder="管理員密碼"
          autocomplete="current-password"
        >

      </label>


      <button
        id="loginBtn"
        class="primary-button"
        type="button"
      >
        登入後台
      </button>


      <p id="msg"></p>

    </section>



    <!-- =========================
         登入後後台
    ========================== -->

    <section
      id="panel"
      hidden
    >


      <!-- 後台功能選單 -->

      <section class="panel">

        <div
          class="tabs"
          style="
            display:grid;
            grid-template-columns:
              repeat(3, 1fr);
            gap:8px;
          "
        >

          <button
            id="pt"
            class="secondary-button"
            type="button"
          >
            🥬 商品管理
          </button>


          <button
            id="ot"
            class="secondary-button"
            type="button"
          >
            🧾 訂單管理
          </button>


          <button
            id="st"
            class="secondary-button"
            type="button"
          >
            🏪 店家資訊
          </button>

        </div>


        <button
          id="logoutBtn"
          class="secondary-button"
          type="button"
          style="
            width:100%;
            margin-top:10px;
          "
        >
          登出管理員
        </button>

      </section>



      <!-- =========================
           商品管理
      ========================== -->

      <section
        class="panel"
        id="productsPanel"
      >

        <div class="section-title-row">

          <div>

            <h2>
              🥬 商品管理
            </h2>

            <p class="section-description">
              管理每日商品、價格及上下架
            </p>

          </div>


          <button
            id="add"
            class="secondary-button"
            type="button"
          >
            ＋ 新增
          </button>

        </div>


        <div id="products"></div>

      </section>



      <!-- =========================
           訂單管理
      ========================== -->

      <section
        class="panel"
        id="ordersPanel"
        hidden
      >

        <div class="section-title-row">

          <div>

            <h2>
              🧾 訂單管理
            </h2>

            <p class="section-description">
              查看及處理客戶訂單
            </p>

          </div>

        </div>


        <div id="orders"></div>

      </section>



      <!-- =========================
           店家資訊設定
      ========================== -->

      <section
        class="panel"
        id="storeSettingsPanel"
        hidden
      >

        <div class="section-title-row">

          <div>

            <h2>
              🏪 店家資訊設定
            </h2>

            <p class="section-description">
              儲存後，前台會自動顯示最新資料
            </p>

          </div>

        </div>



        <!-- 店名 -->

        <label class="form-label">

          <span>
            店家名稱
          </span>

          <input
            id="settingStoreName"
            type="text"
            placeholder="例如：英姐蔬果商行"
          >

        </label>



        <!-- 首頁介紹 -->

        <label class="form-label">

          <span>
            首頁介紹
          </span>

          <textarea
            id="settingHomeIntro"
            rows="3"
            placeholder="例如：每日新鮮蔬果，簡單選購、快速下單。"
          ></textarea>

        </label>



        <!-- 首頁公告 -->

        <label class="form-label">

          <span>
            📢 首頁公告
          </span>

          <textarea
            id="settingAnnouncement"
            rows="4"
            placeholder="例如：今日蔬菜已更新，歡迎訂購！"
          ></textarea>

        </label>



        <!-- 地址 -->

        <label class="form-label">

          <span>
            📍 店家地址
          </span>

          <input
            id="settingAddress"
            type="text"
            placeholder="請輸入店家地址"
          >

        </label>



        <!-- 電話 -->

        <label class="form-label">

          <span>
            ☎️ 店家電話
          </span>

          <input
            id="settingPhone"
            type="tel"
            placeholder="請輸入店家電話"
          >

        </label>



        <!-- 營業時間 -->

        <label class="form-label">

          <span>
            🕐 營業時間
          </span>

          <textarea
            id="settingHours"
            rows="3"
            placeholder="例如：週一至週六 07:00～18:00"
          ></textarea>

        </label>



        <!-- 店家說明 -->

        <label class="form-label">

          <span>
            📝 店家說明
          </span>

          <textarea
            id="settingDescription"
            rows="4"
            placeholder="例如：每日提供新鮮蔬果，歡迎選購。"
          ></textarea>

        </label>



        <button
          id="saveStoreSettings"
          class="primary-button"
          type="button"
        >
          💾 儲存店家資訊
        </button>


        <div
          id="storeSettingsResult"
          style="margin-top:12px;"
        ></div>

      </section>


    </section>

  </main>


<dialog id="productEditor" class="editor-dialog" aria-labelledby="editorTitle">
<form id="productForm"><div class="section-title-row"><h2 id="editorTitle">編輯商品</h2><button type="button" id="cancelProduct" class="secondary-button">取消</button></div>
<div class="photo-editor"><img id="photoPreview" alt="商品照片預覽" hidden><div id="photoEmpty">尚未設定照片</div>
<label class="upload-button">選擇／更換照片<input id="productPhoto" type="file" accept="image/jpeg,image/png,image/webp"></label>
<button id="removeProductPhoto" type="button" class="secondary-button">移除照片</button>
<p class="section-description">保留完整照片並自動壓縮。選好照片後，請按「儲存商品」。</p></div>
<label class="form-label"><span>商品名稱</span><input id="productName" required maxlength="80"></label>
<div class="editor-columns"><label class="form-label"><span>單位</span><input id="productUnit" required maxlength="20"></label><label class="form-label"><span>價格（元）</span><input id="productPrice" required type="number" min="0" max="999999" step="0.01"></label></div>
<div class="editor-columns"><label class="form-label"><span>商品分類</span><select id="productCategory"><option value="leaf">葉菜類</option><option value="root">根莖類</option><option value="mushroom">菇類</option><option value="fruit">水果</option><option value="other">其他蔬果（顯示於今日新鮮）</option></select></label><label class="form-label"><span>排序（數字小的在前面）</span><input id="productSort" type="number" min="0" step="1" required></label></div>
<label class="check-label"><input id="productActive" type="checkbox">上架商品</label>
<p id="photoMessage" role="status" aria-live="polite"></p><button id="saveProduct" class="primary-button" type="submit">儲存商品</button></form></dialog>

  <script
    type="module"
    src="admin.js?v=40"
  ></script>

</body>

</html>
